events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # =========================================================================
    # 1. SECURITY SHIELD & HARDENING
    # =========================================================================
    # Hide Nginx version banner from response headers to mitigate CVE recon
    server_tokens off;

    # Restrict maximum upload body size to prevent memory-exhaustion attacks
    client_max_body_size 25M;

    # Standard OWASP defensive security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Network-level Rate Limiting against DDoS & Brute-force attacks (20 req/s per IP)
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=20r/s;
    limit_req_status 429;

    # =========================================================================
    # 2. GZIP COMPRESSION
    # Compresses text/json/js/css assets to reduce payload size by up to 70%
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # =========================================================================
    # 3. EDGE CACHING FOR STATIC ASSETS
    # Caches Next.js client-side chunks and media assets directly in Nginx
    # =========================================================================
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC_ASSETS_CACHE:10m max_size=500m inactive=7d use_temp_path=off;

    # =========================================================================
    # 4. LOAD BALANCING (UPSTREAM CLUSTERS)
    # Uses least-connections algorithm with persistent keepalive socket pools
    # =========================================================================
    upstream frontend_server {
        least_conn;
        server frontend:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream api_server {
        least_conn;
        server api:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream bot_server {
        least_conn;
        server bot:8001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # =========================================================================
    # 5. HTTP SERVER BLOCK (PORT 80)
    # =========================================================================
    server {
        listen 80;
        server_name localhost;

        # ---------------------------------------------------------------------
        # Next.js Static Asset Caching (bypasses Node.js for maximum performance)
        # ---------------------------------------------------------------------
        location /_next/static/ {
            proxy_cache STATIC_ASSETS_CACHE;
            proxy_pass http://frontend_server;
            proxy_ignore_headers Set-Cookie;
            proxy_hide_header Set-Cookie;

            # Instructs client browsers to cache immutable assets for 1 year
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ---------------------------------------------------------------------
        # Chat Session & Conversation History API (Dispatched to Bot Service)
        # ---------------------------------------------------------------------
        location /api/v1/chat/ {
            limit_req zone=api_rate_limit burst=30 nodelay;
            proxy_pass http://bot_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------------
        # General REST APIs (Resumes Upload, Parsing, Claim-Check Endpoints)
        # ---------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_rate_limit burst=30 nodelay;
            proxy_pass http://api_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------------
        # Real-Time Conversational WebSocket Connection
        # ---------------------------------------------------------------------
        location /ws/ {
            proxy_pass http://bot_server;
            proxy_http_version 1.1;

            # Essential upgrade headers to maintain bi-directional WebSocket stream
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Extended idle timeouts for interactive AI chat sessions
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---------------------------------------------------------------------
        # Next.js Web Application Frontend (Default Route)
        # ---------------------------------------------------------------------
        location / {
            proxy_pass http://frontend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =========================================================================
    # 6. HTTPS / SSL/TLS TERMINATION (PORT 443 - PRODUCTION ON AWS)
    # Activate when domain name and Let's Encrypt certificates are provisioned
    # =========================================================================
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #
    #     # Mirror location routes here...
    # }
}
